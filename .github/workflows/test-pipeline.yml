name: Test Pipeline

on:
  push:
    branches: [ main, "unified-pipeline-*" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Pixi
      uses: prefix-dev/setup-pixi@v0.8.0
      with:
        pixi-version: latest

    - name: Install dependencies
      run: pixi install

    - name: Configure conda channels
      run: |
        # Configure conda to use prefix.dev mirrors and strict channel priority
        # Write to both ~/.condarc (used by snakemake's conda) and local .condarc
        mkdir -p ~/.conda
        cat > ~/.condarc << 'CONDARC_EOF'
        channel_priority: strict
        channels:
          - https://prefix.dev/conda-forge
          - https://prefix.dev/bioconda
        show_channel_urls: false
        solver: libmamba
        CONDARC_EOF

        # Verify configuration
        pixi run conda config --show channels
        pixi run conda config --show channel_priority
        echo "Conda channels configured in ~/.condarc"

    - name: Validate config schema
      run: |
        pixi run python -c "
        import yaml
        with open('config/config.yaml') as f:
            config = yaml.safe_load(f)

        # Check required top-level keys exist. 'trees' replaces the old scalar
        # 'output_dir'/'mat'/'metadata'; 'output_root' is optional (defaults to
        # 'results').
        required_keys = [
            'trees', 'ref_fasta', 'ref_gtf', 'qc_filter_options',
            'clade_column', 'min_clade_size', 'max_nt_mutations',
            'site_include_range', 'clade_founders', 'threads'
        ]
        for key in required_keys:
            assert key in config, f'Missing required config key: {key}'

        # Each tree needs mat + metadata; max_leaf_date is optional per tree.
        trees = config['trees']
        assert isinstance(trees, dict) and trees, 'trees must be a non-empty mapping'
        for label, entry in trees.items():
            for k in ('mat', 'metadata'):
                assert entry.get(k), f'Tree {label!r} missing required key {k!r}'

        # QC block uses the renamed leaf-date bounds. min_leaf_date is required;
        # max_leaf_date is optional (unset -> None, i.e. no upper date cutoff).
        assert 'min_leaf_date' in config['qc_filter_options'], \
            'qc_filter_options missing min_leaf_date'

        print('Config schema validation passed!')
        "

    - name: Validate data files exist
      run: |
        test -f data/usher_masked_sites.yaml
        test -f data/lan_2022/41467_2022_28603_MOESM11_ESM.txt
        echo "Data files validation passed!"

    - name: Validate conda environment specs
      run: |
        # Validate YAML syntax for all env files
        pixi run python -c "
        import yaml
        import os

        env_dir = 'workflow/envs'
        for fname in os.listdir(env_dir):
            if fname.endswith('.yml'):
                with open(os.path.join(env_dir, fname)) as f:
                    env = yaml.safe_load(f)
                assert 'dependencies' in env, f'{fname} missing dependencies key'
                print(f'{fname}: {len(env[\"dependencies\"])} dependencies')
        print('All environment specs valid!')
        "

    - name: Verify key packages importable
      run: |
        pixi run python -c "
        import pandas
        import numpy
        import yaml
        # scipy and statsmodels are in conda envs, not pixi env
        print('Core packages importable!')
        "

    - name: Validate Snakefile syntax
      run: |
        # Note: --lint returns non-zero for style suggestions (e.g., "Mixed rules and functions")
        # We allow this to pass since the only remaining warning is a style preference
        pixi run snakemake --lint \
          --configfile config/config_test_data.yaml || true

    - name: Dry run pipeline
      run: |
        export CONDARC="$HOME/.condarc"
        pixi run snakemake -n --use-conda \
          --conda-frontend conda \
          --configfile config/config_test_data.yaml

    - name: Run test pipeline
      timeout-minutes: 30
      run: |
        # Ensure snakemake's conda uses our channel configuration
        export CONDARC="$HOME/.condarc"

        # Set conda timeout settings for CI
        export CONDA_REMOTE_CONNECT_TIMEOUT_SECS=30
        export CONDA_REMOTE_READ_TIMEOUT_SECS=180
        export CONDA_REMOTE_MAX_RETRIES=5

        # NOTE: do NOT set CONDA_NO_PLUGINS here. The conda frontend now uses the
        # libmamba solver, which is a conda *plugin* (conda-libmamba-solver);
        # disabling plugins makes conda fail with "solver backend (libmamba) was
        # not recognized". See mat-pcp #105.

        # Show conda configuration being used
        echo "Conda configuration:"
        pixi run conda config --show channels
        pixi run conda config --show channel_priority

        # Run pipeline (single attempt with proper timeout)
        pixi run snakemake -j $(nproc) --use-conda \
          --conda-frontend conda \
          --configfile config/config_test_data.yaml

    - name: Set output directory variable
      run: |
        # Determine the actual output directory created by the pipeline
        # (includes version suffix added by versioning system)
        OUTPUT_DIR=$(ls -d results/test_data* | head -1)
        echo "OUTPUT_DIR=$OUTPUT_DIR" >> $GITHUB_ENV
        echo "Using output directory: $OUTPUT_DIR"

    - name: Verify input linking
      run: |
        # Check symlinks were created
        test -L $OUTPUT_DIR/mat/mat_tree.pb.gz
        test -L $OUTPUT_DIR/mat/metadata.tsv.gz
        echo "Input linking verified!"

    - name: Verify metadata filtering
      run: |
        pixi run python -c "
        import pandas as pd
        import gzip

        # Load filtered metadata
        with gzip.open('${OUTPUT_DIR}/mat/filtered_metadata.tsv.gz', 'rt') as f:
            df = pd.read_csv(f, sep='\t')

        print(f'Filtered metadata rows: {len(df)}')
        assert len(df) > 0, 'Filtered metadata is empty!'

        # Check required columns exist
        required_cols = ['strain', 'date']
        for col in required_cols:
            assert col in df.columns, f'Missing column: {col}'

        print('Metadata filtering verified!')
        "

    - name: Verify invalid strains log
      run: |
        test -f $OUTPUT_DIR/log/invalid_strains.txt
        head -10 $OUTPUT_DIR/log/invalid_strains.txt
        echo "Invalid strains log verified!"

    - name: Verify tree filtering
      run: |
        test -f $OUTPUT_DIR/mat/filtered_tree_raw.pb
        echo "Tree filtering verified!"

        # Check log files
        test -f $OUTPUT_DIR/log/filter_mat_tree.stdout
        test -f $OUTPUT_DIR/log/valid_strains.txt
        echo "Valid strains: $(wc -l < $OUTPUT_DIR/log/valid_strains.txt)"

    - name: Verify reference files
      run: |
        # Check FASTA
        test -f $OUTPUT_DIR/ref/ref.fa
        # Verify FASTA length without BioPython (which is only in conda envs)
        SEQ_LEN=$(grep -v '>' $OUTPUT_DIR/ref/ref.fa | tr -d '\n' | wc -c)
        echo "Reference sequence length: $SEQ_LEN bp"
        [ "$SEQ_LEN" -gt 29000 ] || (echo "Reference too short!" && exit 1)

        # Check GTF files
        test -f $OUTPUT_DIR/ref/original_ref.gtf
        test -f $OUTPUT_DIR/ref/edited_ref.gtf

        # Verify ORF9b was added
        grep -q "ORF9b" $OUTPUT_DIR/ref/edited_ref.gtf && \
          echo "ORF9b gene added successfully!"

    - name: Verify coding sites
      run: |
        test -f $OUTPUT_DIR/ref/coding_sites.csv
        pixi run python -c "
        import pandas as pd
        df = pd.read_csv('${OUTPUT_DIR}/ref/coding_sites.csv')
        print(f'Coding sites: {len(df)} total')

        # Check structure
        assert 'site' in df.columns
        assert 'codon_position' in df.columns
        assert 'gene' in df.columns

        # Check gene coverage
        genes = set()
        for g in df['gene']:
            if g != 'noncoding':
                genes.update(g.split(';'))
        print(f'Genes found: {sorted(genes)}')

        # Verify ORF9b is present
        assert 'ORF9b' in genes, 'ORF9b not found in coding sites!'
        "

    - name: Verify conda environments created
      run: |
        # Check that snakemake created the conda environments
        ls -la .snakemake/conda/ || echo "Conda envs in default location"

    - name: Multi-tree independence smoke test
      run: |
        # The single-tree run above already exercises the {tree} machinery
        # end-to-end for one tree. This step proves *independence*: two trees
        # in one config resolve their get_clades checkpoints separately, with
        # neither leaking into the other. It only builds each tree's
        # clade_counts.csv (link_inputs -> filter_metadata -> get_clades),
        # reusing the conda envs already built above -- seconds, not a second
        # full pipeline run. The two trees share identical global config and
        # the same input data, differing only in max_leaf_date, so a
        # difference in clade counts can only come from per-tree resolution.
        # Derive the version suffix from VERSION so this step survives bumps.
        V=$(cat VERSION)
        pixi run snakemake \
          results/test_data_${V}/mat/clade_counts.csv \
          results/test_data_early_${V}/mat/clade_counts.csv \
          -j $(nproc) --use-conda --conda-frontend conda \
          --configfile config/config_test_data_multitree.yaml
        pixi run python -c "
        import pandas as pd
        def adequate(p):
            df = pd.read_csv(p)
            return int(df['adequate_sample_counts'].sum()), len(df)
        a_ok, a_tot = adequate('results/test_data_${V}/mat/clade_counts.csv')
        e_ok, e_tot = adequate('results/test_data_early_${V}/mat/clade_counts.csv')
        print(f'test_data (max_leaf_date 2022-06-01): {a_tot} clades, {a_ok} adequate')
        print(f'test_data_early (max_leaf_date 2021-06-01): {e_tot} clades, {e_ok} adequate')
        # Independence: the earlier cutoff must yield FEWER clades. Equal counts
        # would mean the per-tree max_leaf_date override was ignored (the trees
        # share a single resolution) -- the exact regression this test guards.
        assert e_tot < a_tot, (
            f'Expected the earlier-cutoff tree to have fewer clades, '
            f'got early={e_tot} vs default={a_tot} -- trees did not resolve '
            f'independently.'
        )
        print('Multi-tree independence verified: checkpoints resolved separately.')
        "

    - name: Verify clade counts checkpoint
      run: |
        test -f $OUTPUT_DIR/mat/clade_counts.csv
        pixi run python -c "
        import pandas as pd
        df = pd.read_csv('${OUTPUT_DIR}/mat/clade_counts.csv')
        print(f'Total clades: {len(df)}')
        print(f'Adequate clades: {df.adequate_sample_counts.sum()}')

        # Check structure
        assert 'count' in df.columns
        assert 'adequate_sample_counts' in df.columns

        # Print clade summary
        print('\nClade counts:')
        print(df.sort_values('count', ascending=False).head(10))
        "

    - name: Verify per-clade sample files
      run: |
        pixi run python -c "
        import pandas as pd
        import os

        # Get adequate clades
        df = pd.read_csv('${OUTPUT_DIR}/mat/clade_counts.csv')
        clade_col = df.columns[0]
        adequate = df[df['adequate_sample_counts'] == True][clade_col].tolist()

        print(f'Checking {len(adequate)} adequate clades...')

        for clade in adequate:
            samples_file = f'${OUTPUT_DIR}/mat/clades/{clade}_samples.txt'
            if os.path.exists(samples_file):
                with open(samples_file) as f:
                    count = len(f.readlines())
                print(f'  {clade}: {count} samples')
            else:
                print(f'  {clade}: MISSING')
        "

    - name: Verify per-clade tree files
      run: |
        pixi run python -c "
        import pandas as pd
        import os

        # Get adequate clades
        df = pd.read_csv('${OUTPUT_DIR}/mat/clade_counts.csv')
        clade_col = df.columns[0]
        adequate = df[df['adequate_sample_counts'] == True][clade_col].tolist()

        print(f'Checking {len(adequate)} clade trees...')

        missing = []
        for clade in adequate:
            tree_file = f'${OUTPUT_DIR}/mat/clades/{clade}_tree.pb'
            if os.path.exists(tree_file):
                size = os.path.getsize(tree_file)
                print(f'  {clade}: {size} bytes')
            else:
                missing.append(clade)

        if missing:
            print(f'\nMissing trees: {missing}')
        else:
            print('\nAll clade trees present!')
        "

    - name: Verify per-clade PCP files
      run: |
        pixi run python -c "
        import pandas as pd
        import os

        # Get adequate clades
        df = pd.read_csv('${OUTPUT_DIR}/mat/clade_counts.csv')
        clade_col = df.columns[0]
        adequate = df[df['adequate_sample_counts'] == True][clade_col].tolist()

        print(f'Checking {len(adequate)} clade PCP files...')

        for clade in adequate:
            pcp_file = f'${OUTPUT_DIR}/pcps/S/{clade}_pcps.csv'
            if os.path.exists(pcp_file):
                pcp_df = pd.read_csv(pcp_file)
                print(f'  {clade}: {len(pcp_df)} PCPs')

                # Validate structure
                assert 'parent' in pcp_df.columns
                assert 'child' in pcp_df.columns
                assert 'branch_length' in pcp_df.columns
            else:
                print(f'  {clade}: MISSING')
        "

    - name: Verify aggregated PCP file
      run: |
        test -f $OUTPUT_DIR/pcps/S/all_pcps.csv
        pixi run python -c "
        import pandas as pd

        df = pd.read_csv('${OUTPUT_DIR}/pcps/S/all_pcps.csv')
        print(f'Total aggregated PCPs: {len(df)}')
        print(f'Clades: {sorted(df.clade.unique())}')
        print(f'PCPs per clade:')
        print(df.groupby('clade').size())

        # Validate structure
        assert 'clade' in df.columns
        assert 'parent' in df.columns
        assert 'child' in df.columns
        assert 'branch_length' in df.columns

        # Check that parent and child are sequences
        assert df['parent'].str.len().min() > 0
        assert df['child'].str.len().min() > 0
        "

    - name: Verify PCP sequence lengths
      run: |
        pixi run python -c "
        import pandas as pd

        df = pd.read_csv('${OUTPUT_DIR}/pcps/S/all_pcps.csv')

        # Check sequence lengths are consistent
        parent_lens = df['parent'].str.len()
        child_lens = df['child'].str.len()

        assert (parent_lens == child_lens).all(), 'Parent/child length mismatch!'

        print(f'Sequence length: {parent_lens.iloc[0]}')
        print('Sequence lengths are consistent!')
        "

    - name: Generate clade founder files
      run: |
        # Build clade founder JSONs and FASTA files for first 3 clades
        pixi run python -c "
        import pandas as pd
        import os
        output_dir = os.environ['OUTPUT_DIR']
        df = pd.read_csv(f'{output_dir}/mat/clade_counts.csv')
        clade_col = df.columns[0]
        adequate = df[df['adequate_sample_counts'] == True][clade_col].tolist()
        # Print first 3 clades for snakemake targets
        for clade in adequate[:3]:
            print(f'{output_dir}/clade_founders/{clade}.fa')
        " > /tmp/founder_targets.txt

        # Build founder files for first 3 clades
        pixi run snakemake $(cat /tmp/founder_targets.txt | tr '\n' ' ') \
          -j 2 --use-conda \
          --conda-frontend conda \
          --configfile config/config_test_data.yaml

    - name: Verify clade founder files
      run: |
        # Check JSON downloads
        test -f $OUTPUT_DIR/clade_founders/clade_founders_neher.json
        test -f $OUTPUT_DIR/clade_founders/clade_founders_roemer.json

        pixi run python -c "
        import pandas as pd
        import os

        # Get adequate clades
        df = pd.read_csv('${OUTPUT_DIR}/mat/clade_counts.csv')
        clade_col = df.columns[0]
        adequate = df[df['adequate_sample_counts'] == True][clade_col].tolist()

        print(f'Checking founder files for first 3 of {len(adequate)} clades...')

        for clade in adequate[:3]:  # Check first 3 clades (same as we built)
            fasta_file = f'${OUTPUT_DIR}/clade_founders/{clade}.fa'

            if os.path.exists(fasta_file):
                # Check FASTA file size
                size = os.path.getsize(fasta_file)
                print(f'  {clade}: {size} bytes')
            else:
                print(f'  {clade}: MISSING - this is an error!')
                exit(1)
        print('Clade founder verification passed!')
        "

    - name: Generate site mask and mutation files
      run: |
        # Build site mask
        pixi run snakemake -j 1 --use-conda $OUTPUT_DIR/ref/site_mask.csv \
          --conda-frontend conda \
          --configfile config/config_test_data.yaml

        # Build mutation translation and sample paths for first 2 clades
        pixi run python -c "
        import pandas as pd
        import os
        output_dir = os.environ['OUTPUT_DIR']
        df = pd.read_csv(f'{output_dir}/mat/clade_counts.csv')
        clade_col = df.columns[0]
        adequate = df[df['adequate_sample_counts'] == True][clade_col].tolist()
        for clade in adequate[:2]:
            # Request both mutation translation and sample path outputs
            print(f'{output_dir}/mutations/{clade}_mutations.tsv')
            print(f'{output_dir}/mutations/{clade}_nt_mutations.csv')
        " > /tmp/mutation_targets.txt

        pixi run snakemake $(cat /tmp/mutation_targets.txt | tr '\n' ' ') \
          -j 2 --use-conda \
          --conda-frontend conda \
          --configfile config/config_test_data.yaml

    - name: Verify site mask
      run: |
        test -f $OUTPUT_DIR/ref/site_mask.csv
        pixi run python -c "
        import pandas as pd
        df = pd.read_csv('${OUTPUT_DIR}/ref/site_mask.csv')
        print(f'Masked sites: {len(df)}')
        assert 'site' in df.columns
        assert len(df) > 0, 'No masked sites found!'
        print('Site mask verification passed!')
        "

    - name: Verify mutation translation
      run: |
        pixi run python -c "
        import pandas as pd
        import os

        df = pd.read_csv('${OUTPUT_DIR}/mat/clade_counts.csv')
        clade_col = df.columns[0]
        adequate = df[df['adequate_sample_counts'] == True][clade_col].tolist()

        print('Checking mutation translation files...')
        for clade in adequate[:2]:  # Check first 2
            tsv_file = f'${OUTPUT_DIR}/mutations/{clade}_mutations.tsv'
            if os.path.exists(tsv_file):
                mut_df = pd.read_csv(tsv_file, sep='\t')
                print(f'  {clade}: {len(mut_df)} translated mutations')
            else:
                print(f'  {clade}: MISSING - this is an error!')
                exit(1)
        print('Mutation translation verification passed!')
        "

    - name: Verify sample paths
      run: |
        pixi run python -c "
        import pandas as pd
        import os

        df = pd.read_csv('${OUTPUT_DIR}/mat/clade_counts.csv')
        clade_col = df.columns[0]
        adequate = df[df['adequate_sample_counts'] == True][clade_col].tolist()

        print('Checking sample path files...')
        for clade in adequate[:2]:  # Check first 2
            csv_file = f'${OUTPUT_DIR}/mutations/{clade}_nt_mutations.csv'
            if os.path.exists(csv_file):
                nt_df = pd.read_csv(csv_file)
                print(f'  {clade}: {len(nt_df)} nodes with mutations')
                assert 'node_id' in nt_df.columns, 'Missing node_id column'
                assert 'nt_mutations' in nt_df.columns, 'Missing nt_mutations column'
            else:
                print(f'  {clade}: MISSING - this is an error!')
                exit(1)
        print('Sample paths verification passed!')
        "

    - name: Verify mutation counting
      run: |
        pixi run python -c "
        import pandas as pd
        import os

        df = pd.read_csv('${OUTPUT_DIR}/mat/clade_counts.csv')
        clade_col = df.columns[0]
        adequate = df[df['adequate_sample_counts'] == True][clade_col].tolist()

        print(f'Checking mutation counts for {len(adequate)} clades...')

        for clade in adequate[:3]:  # Check first 3
            csv_file = f'${OUTPUT_DIR}/mutation_counts/{clade}.csv'
            if os.path.exists(csv_file):
                counts_df = pd.read_csv(csv_file)
                print(f'  {clade}: {len(counts_df)} unique mutations')

                # Check expected columns
                required_cols = ['nt_mutation', 'nt_site', 'count', 'synonymous']
                for col in required_cols:
                    assert col in counts_df.columns, f'Missing column: {col}'

                # Check some mutations are counted
                if len(counts_df) > 0:
                    print(f'    Total count: {counts_df[\"count\"].sum()}')
                    print(f'    Synonymous: {counts_df[\"synonymous\"].sum()}')
            else:
                print(f'  {clade}: MISSING')
        "

    - name: Verify aggregated mutation counts
      run: |
        test -f $OUTPUT_DIR/mutation_counts/aggregated.csv
        pixi run python -c "
        import pandas as pd

        agg = pd.read_csv('${OUTPUT_DIR}/mutation_counts/aggregated.csv')
        print(f'Aggregated mutations: {len(agg)}')

        # Check structure
        assert 'clade' in agg.columns, 'Missing clade column'
        assert 'nt_mutation' in agg.columns, 'Missing nt_mutation column'
        assert 'count' in agg.columns, 'Missing count column'

        # Check clade distribution
        print(f'Clades in aggregated: {sorted(agg[\"clade\"].unique())}')
        print(f'Total mutations across all clades: {agg[\"count\"].sum()}')
        "

    - name: Verify UShER masked sites
      run: |
        test -f data/usher_masked_sites.yaml
        pixi run python -c "
        import yaml

        with open('data/usher_masked_sites.yaml') as f:
            masks = yaml.safe_load(f)

        print(f'UShER masks defined: {list(masks.keys())}')
        for mask_name, mask_data in masks.items():
            clades = mask_data.get('clades', [])
            sites = mask_data.get('sites', [])
            print(f'  {mask_name}: {len(clades)} clades, {len(sites)} sites')
        "

    - name: Verify clade founder nucleotides
      run: |
        test -f $OUTPUT_DIR/clade_founder_nts.csv
        pixi run python -c "
        import pandas as pd

        nts = pd.read_csv('${OUTPUT_DIR}/clade_founder_nts.csv')
        print(f'Clade founder nucleotides: {len(nts)} entries')

        # Check columns
        assert 'clade' in nts.columns
        assert 'site' in nts.columns
        assert 'nt' in nts.columns

        # Check clade distribution
        print(f'Clades: {sorted(nts[\"clade\"].unique())}')
        print(f'Sites per clade: {nts.groupby(\"clade\").size().mean():.0f} avg')
        "

    - name: Verify unified count table
      run: |
        test -f $OUTPUT_DIR/counts_all.csv
        pixi run python -c "
        import pandas as pd

        df = pd.read_csv('${OUTPUT_DIR}/counts_all.csv')
        print(f'Count table entries: {len(df)}')

        # Check columns
        assert 'clade' in df.columns
        assert 'nt_mutation' in df.columns
        assert 'actual_count' in df.columns
        assert 'exclude' in df.columns
        assert 'masked_in_usher' in df.columns

        # Summary
        print(f'Clades: {sorted(df[\"clade\"].unique())}')
        print(f'Columns: {list(df.columns)}')
        print(f'Excluded: {df[\"exclude\"].sum()}, masked_in_usher: {df[\"masked_in_usher\"].sum()}')
        "

    - name: Verify annotated counts
      run: |
        test -f $OUTPUT_DIR/glm/annotated_counts.csv
        test -f $OUTPUT_DIR/glm/clade_founder_annotated.csv
        pixi run python -c "
        import pandas as pd

        counts = pd.read_csv('${OUTPUT_DIR}/glm/annotated_counts.csv')
        founder = pd.read_csv('${OUTPUT_DIR}/glm/clade_founder_annotated.csv')

        print(f'Annotated counts: {len(counts)} entries')
        print(f'Annotated founder: {len(founder)} entries')

        # Check required annotation columns
        assert 'mut_type' in counts.columns, 'Missing mut_type column'
        assert 'unpaired' in counts.columns, 'Missing unpaired column'
        assert 'nt_site_before_boundary' in counts.columns, 'Missing boundary column'
        assert 'ss_prediction' in counts.columns, 'Missing ss_prediction column'

        # Print summary
        print(f'Mutation types: {sorted(counts[\"mut_type\"].unique())}')
        print(f'SS predictions: {counts[\"ss_prediction\"].value_counts().to_dict()}')
        print(f'Before boundary: {counts[\"nt_site_before_boundary\"].sum()}')
        "

    - name: Verify curated counts
      run: |
        test -f $OUTPUT_DIR/glm/curated_counts.csv
        pixi run python -c "
        import pandas as pd

        curated = pd.read_csv('${OUTPUT_DIR}/glm/curated_counts.csv')
        print(f'Curated counts: {len(curated)} entries')

        # Check structure
        if len(curated) > 0:
            # Should not have exclusion columns
            assert 'exclude' not in curated.columns or curated['exclude'].sum() == 0
            assert 'masked_in_usher' not in curated.columns or curated['masked_in_usher'].sum() == 0

            # Print summary
            print(f'Total actual count: {curated[\"actual_count\"].sum() if \"actual_count\" in curated.columns else \"N/A\"}')
        else:
            print('WARNING: Curated dataset is empty (may be expected with small test data)')
        "

    - name: Verify RNA structure data exists
      run: |
        test -f data/lan_2022/41467_2022_28603_MOESM11_ESM.txt
        wc -l data/lan_2022/41467_2022_28603_MOESM11_ESM.txt
        echo "RNA structure file verified"

    - name: Verify GLM modules exist
      run: |
        test -f workflow/modules/__init__.py
        test -f workflow/modules/glm.py
        test -f workflow/modules/rates.py
        test -f workflow/modules/load.py
        echo "All GLM modules present"

    - name: Verify master table
      run: |
        test -f $OUTPUT_DIR/glm/master_table.csv
        pixi run python -c "
        import pandas as pd

        master = pd.read_csv('${OUTPUT_DIR}/glm/master_table.csv')
        print(f'Master table: {len(master)} rate entries')

        # Check required columns
        assert 'mut_type' in master.columns, 'Missing mut_type'
        assert 'motif' in master.columns, 'Missing motif'
        assert 'rate' in master.columns, 'Missing rate'

        # Check all mutation types are present
        expected_types = ['AC', 'AG', 'AT', 'CA', 'CG', 'CT', 'GA', 'GC', 'GT', 'TA', 'TC', 'TG']
        actual_types = sorted(master['mut_type'].unique())
        print(f'Mutation types: {actual_types}')

        # Print rate summary
        print(f'Rate range: {master[\"rate\"].min():.4f} - {master[\"rate\"].max():.4f}')
        print(f'Mean rate: {master[\"rate\"].mean():.4f}')
        "

    - name: Verify rates table
      run: |
        test -f $OUTPUT_DIR/rates_table.csv
        pixi run python -c "
        import pandas as pd

        rates = pd.read_csv('${OUTPUT_DIR}/rates_table.csv')
        print(f'Rates table: {len(rates)} entries')

        # Check columns
        assert 'mut_type' in rates.columns
        assert 'motif' in rates.columns
        assert 'rate' in rates.columns

        print(f'Unique motifs: {rates[\"motif\"].nunique()}')
        "

    - name: Verify problematic sites
      run: |
        test -f $OUTPUT_DIR/S_codon_sites_to_mask.txt
        pixi run python -c "
        with open('${OUTPUT_DIR}/S_codon_sites_to_mask.txt') as f:
            sites = [line.strip() for line in f if line.strip()]
        print(f'Problematic Spike codon sites: {len(sites)}')
        if sites:
            print(f'First 10 sites: {sites[:10]}')
        "

    - name: Verify probfit module
      run: |
        test -f workflow/modules/probfit.py
        # Note: Full import test requires scipy which is in conda envs, not pixi
        # The actual fitness computation runs within snakemake with conda envs
        pixi run python -c "
        # Just verify syntax by compiling
        import py_compile
        py_compile.compile('workflow/modules/probfit.py')
        print('probfit module syntax valid!')
        "

    - name: Verify expected counts by clade
      run: |
        test -f $OUTPUT_DIR/fitness/expected_counts_by_clade.csv
        pixi run python -c "
        import pandas as pd

        pred = pd.read_csv('${OUTPUT_DIR}/fitness/expected_counts_by_clade.csv')
        print(f'Expected counts: {len(pred)} entries')

        # Check required columns
        assert 'expected_count' in pred.columns, 'Missing expected_count'
        assert 'tau_squared' in pred.columns, 'Missing tau_squared'

        print(f'Expected count range: {pred[\"expected_count\"].min():.2f} - {pred[\"expected_count\"].max():.2f}')
        print(f'Tau squared range: {pred[\"tau_squared\"].min():.4f} - {pred[\"tau_squared\"].max():.4f}')
        "

    - name: Verify nucleotide mutation fitness
      run: |
        pixi run python -c "
        import pandas as pd
        import os

        df = pd.read_csv('${OUTPUT_DIR}/mat/clade_counts.csv')
        clade_col = df.columns[0]
        adequate = df[df['adequate_sample_counts'] == True][clade_col].tolist()

        print(f'Checking nucleotide fitness for clades...')

        for clade in adequate[:3]:  # Check first 3
            fitness_file = f'${OUTPUT_DIR}/fitness/ntmut_fitness/{clade}_ntmut_fitness.csv'
            if os.path.exists(fitness_file):
                fit_df = pd.read_csv(fitness_file)
                print(f'  {clade}: {len(fit_df)} mutations')

                # Check fitness columns
                assert 'f_mean' in fit_df.columns, 'Missing f_mean'
                assert 'f_st_dev' in fit_df.columns, 'Missing f_st_dev'

                print(f'    f_mean range: [{fit_df[\"f_mean\"].min():.2f}, {fit_df[\"f_mean\"].max():.2f}]')
            else:
                print(f'  {clade}: MISSING')
        "

    - name: Verify aggregated nucleotide fitness
      run: |
        test -f $OUTPUT_DIR/fitness/ntmut_fitness_aggregated.csv
        pixi run python -c "
        import pandas as pd

        agg = pd.read_csv('${OUTPUT_DIR}/fitness/ntmut_fitness_aggregated.csv')
        print(f'Aggregated nucleotide fitness: {len(agg)} entries')

        if len(agg) > 0:
            # Check fitness columns
            assert 'f_mean' in agg.columns, 'Missing f_mean'
            assert 'source_clade' in agg.columns, 'Missing source_clade'

            print(f'Clades: {sorted(agg[\"source_clade\"].unique())}')
        "

    - name: Verify aamutfit module
      run: |
        test -f workflow/modules/aamutfit.py
        # Note: Just verify syntax compiles (numpy in conda envs, not pixi)
        pixi run python -c "
        import py_compile
        py_compile.compile('workflow/modules/aamutfit.py')
        print('aamutfit module syntax valid!')
        "

    - name: Verify amino acid fitness by clade
      run: |
        pixi run python -c "
        import pandas as pd
        import os

        df = pd.read_csv('${OUTPUT_DIR}/mat/clade_counts.csv')
        clade_col = df.columns[0]
        adequate = df[df['adequate_sample_counts'] == True][clade_col].tolist()

        print(f'Checking amino acid fitness for clades...')

        for clade in adequate[:3]:  # Check first 3
            fitness_file = f'${OUTPUT_DIR}/aamut_fitness/{clade}_aamut_fitness.csv'
            if os.path.exists(fitness_file):
                fit_df = pd.read_csv(fitness_file)
                print(f'  {clade}: {len(fit_df)} amino acid mutations')
                print(f'    Columns: {list(fit_df.columns)[:10]}...')

                # Check fitness columns
                if len(fit_df) > 0:
                    assert 'delta_fitness' in fit_df.columns, 'Missing delta_fitness'
                    # Note: aa_mutation may not be present if upstream data doesn't have it
                    # (aa_mutation info is in actual counts but not expected counts)
                    if 'aa_mutation' in fit_df.columns:
                        print(f'    Sample aa_mutations: {fit_df[\"aa_mutation\"].dropna().head(3).tolist()}')
                    else:
                        print(f'    Note: aa_mutation column not present (expected with current data flow)')
                    if 'gene' in fit_df.columns:
                        genes = fit_df['gene'].dropna().unique().tolist()
                        print(f'    Genes: {sorted([str(g) for g in genes])[:5]}...')
            else:
                print(f'  {clade}: MISSING')
        "

    - name: Verify aggregated amino acid fitness
      run: |
        test -f $OUTPUT_DIR/aamut_fitness/all_aamut_fitness.csv
        pixi run python -c "
        import pandas as pd

        agg = pd.read_csv('${OUTPUT_DIR}/aamut_fitness/all_aamut_fitness.csv')
        print(f'Aggregated amino acid fitness: {len(agg)} entries')
        print(f'Columns: {list(agg.columns)[:10]}...')

        if len(agg) > 0:
            # Check required columns
            assert 'delta_fitness' in agg.columns, 'Missing delta_fitness'
            # Note: aa_mutation may not be present if upstream data doesn't have it

            if 'gene' in agg.columns:
                genes = agg['gene'].dropna().unique().tolist()
                print(f'Genes represented: {sorted([str(g) for g in genes])}')
            if 'aa_mutation' in agg.columns:
                print(f'Sample aa_mutations: {agg[\"aa_mutation\"].dropna().head(5).tolist()}')
            else:
                print('Note: aa_mutation column not present (expected with current data flow)')
            print(f'Fitness range: [{agg[\"delta_fitness\"].min():.2f}, {agg[\"delta_fitness\"].max():.2f}]')
        "

    - name: Verify PCP-derived AA counts
      run: |
        test -f $OUTPUT_DIR/validation/S/pcp_aa_counts.csv
        pixi run python -c "
        import pandas as pd

        pcp_counts = pd.read_csv('${OUTPUT_DIR}/validation/S/pcp_aa_counts.csv')
        print(f'PCP-derived AA counts: {len(pcp_counts)} entries')

        if len(pcp_counts) > 0:
            # Check structure
            assert 'clade' in pcp_counts.columns, 'Missing clade column'
            assert 'aa_mutation' in pcp_counts.columns, 'Missing aa_mutation column'
            assert 'pcp_count' in pcp_counts.columns, 'Missing pcp_count column'

            # Print summary
            print(f'Unique AA mutations: {pcp_counts[\"aa_mutation\"].nunique()}')
            print(f'Clades: {sorted(pcp_counts[\"clade\"].unique())}')
        "

    - name: Verify validation report
      run: |
        test -f $OUTPUT_DIR/validation/S/pcp_vs_counts_report.txt
        test -f $OUTPUT_DIR/validation/S/pcp_vs_counts_discrepancies.csv
        cat $OUTPUT_DIR/validation/S/pcp_vs_counts_report.txt

    - name: Check validation results
      run: |
        pixi run python -c "
        import pandas as pd

        # Load discrepancies
        disc = pd.read_csv('${OUTPUT_DIR}/validation/S/pcp_vs_counts_discrepancies.csv')
        print(f'Validation discrepancies: {len(disc)}')

        # Check if validation passed
        if len(disc) == 0:
            print('SUCCESS: PCP and aamut_fitness counts match exactly!')
        else:
            print(f'WARNING: {len(disc)} discrepancies found')
            # Analyze discrepancy types
            only_pcp = len(disc[disc['actual_count'] == 0])
            only_aamut = len(disc[disc['pcp_count'] == 0])
            mismatch = len(disc) - only_pcp - only_aamut
            print(f'  Only in PCPs: {only_pcp}')
            print(f'  Only in aamut_fitness: {only_aamut}')
            print(f'  Count mismatches: {mismatch}')
        "

    - name: Generate test summary
      run: |
        pixi run python workflow/scripts/test_summary.py $OUTPUT_DIR > test_summary.txt

    - name: Compare with expected results
      run: |
        pixi run python workflow/scripts/validate_test.py

    - name: Upload test summary
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-summary
        path: test_summary.txt
