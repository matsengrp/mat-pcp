    - name: Verify validation report
      run: |
        test -f $OUTPUT_DIR/validation/S/pcp_vs_counts_report.txt
        test -f $OUTPUT_DIR/validation/S/pcp_vs_counts_discrepancies.csv
        cat $OUTPUT_DIR/validation/S/pcp_vs_counts_report.txt

    # ORF1b is the pcp_gene_cds_blocks override path, end-to-end: its coordinates
    # come from config rather than the GTF, and it is validated against ORF1ab
    # shifted by 4392 codons because it never appears in aamut_fitness under its
    # own name. The "Corresponding codons" line is the anti-vacuity assertion --
    # a report that compared against nothing could not print it (#133).
    #
    # The codon mask is asserted on *content*, not existence. `test -f` passes on
    # an empty file, and an empty mask is exactly the failure mode here: ORF1b is
    # absent from counts_all.csv's GTF-derived `gene` column, so the original
    # name match selected zero rows and wrote an empty file at exit 0 -- leaving
    # ORF1b's DASM-ready PCPs the only ones curated with nothing masked. The
    # check compares the two independent derivations of the same set: ORF1b's
    # (nt_site x config CDS blocks) against ORF1ab's (the GTF `codon_site`
    # column) shifted by 4392. Only a coordinate system consistent in both can
    # satisfy it.
    - name: Verify ORF1b PCPs came from the config coordinate override
      run: |
        test -f $OUTPUT_DIR/pcps/ORF1b/all_pcps.csv.gz
        test -f $OUTPUT_DIR/validation/ORF1b/pcp_vs_counts_report.txt
        cat $OUTPUT_DIR/validation/ORF1b/pcp_vs_counts_report.txt
        pixi run python -c "
        import pandas as pd, sys

        import yaml
        # Derive every coordinate from the config rather than restating it, so a
        # config edit cannot drift silently past this assertion.
        cfg = yaml.safe_load(open('config/config_test_data.yaml'))
        blocks = cfg['pcp_gene_cds_blocks']['ORF1b']
        remap = cfg['pcp_gene_to_fitness_gene']['ORF1b']
        offset, fitness_gene = remap['codon_offset'], remap['gene']
        cds_nt = sum(end - start + 1 for start, end in blocks)
        # divmod, not //: a future block edit that breaks codon alignment would
        # otherwise truncate to a plausible n_codons, shift the last codon, and
        # report "the mask is in the wrong codon numbering" instead of the real
        # cause. gtf.validate_cds_blocks catches this inside the pipeline, but
        # this step reads the config directly and bypasses it.
        #
        # NB: this whole block is a double-quoted shell string, so backticks and
        # dollar-paren command substitution are expanded by bash BEFORE python
        # sees the source -- even inside a python comment. A stray pair of
        # backticks here spliced the output of last(1) into the middle of this
        # script; writing the dollar-paren form out literally then did the same
        # thing again. Use neither form anywhere in this block, prose included.
        n_codons, remainder = divmod(cds_nt, 3)
        if remainder:
            sys.exit(f'pcp_gene_cds_blocks ORF1b totals {cds_nt} nt, not a whole '
                     f'number of codons -- fix the config blocks')
        if fitness_gene not in cfg['pcp_genes']:
            sys.exit(f'this step compares ORF1b against {fitness_gene}, which is '
                     f'not in pcp_genes -- add it, or the mask comparison below '
                     f'has no {fitness_gene} mask to read')
        print(f'config: ORF1b = {blocks} = {cds_nt} nt = {n_codons} codons, '
              f'validated against {fitness_gene} at offset {offset}')

        df = pd.read_csv('${OUTPUT_DIR}/pcps/ORF1b/all_pcps.csv.gz')
        lengths = set(df['parent'].str.len()) | set(df['child'].str.len())
        print(f'ORF1b PCPs: {len(df)} rows, sequence lengths {sorted(lengths)}')
        if lengths != {cds_nt}:
            sys.exit(f'ORF1b PCP sequences must all be {cds_nt} nt; got {sorted(lengths)}')

        report = open('${OUTPUT_DIR}/validation/ORF1b/pcp_vs_counts_report.txt').read()
        for needle in [f'Compared against aamut_fitness gene: {fitness_gene}',
                       f'Corresponding codons: {n_codons}']:
            if needle not in report:
                sys.exit(f'ORF1b report is missing {needle!r}; the fitness-gene '
                         f'remapping did not happen, so the comparison is vacuous')
        print(f'ORF1b validated against {fitness_gene} over {n_codons} '
              f'corresponding codons')

        # No gene's report may be VACUOUS or have compared zero rows. This is the
        # only coverage for that branch: it lives in validate_pcp_vs_aamut.py and
        # nothing else asserts it, so removing it restored the pre-#133 wording
        # with every test still green.
        import glob as _glob
        checked = 0
        for path in sorted(_glob.glob('${OUTPUT_DIR}/validation/*/pcp_vs_counts_report.txt')):
            body = open(path).read()
            if 'VACUOUS' in body:
                sys.exit(f'{path} reports VACUOUS: zero discrepancies and zero '
                         f'matches, i.e. nothing was compared')
            if 'PCP-derived count rows compared: 0\n' in body:
                sys.exit(f'{path} compared 0 PCP-derived rows')
            checked += 1
        if checked == 0:
            sys.exit('no validation reports found to check for vacuity')
        print(f'{checked} validation reports are non-vacuous')

        def read_mask(gene):
            path = f'${OUTPUT_DIR}/{gene}_codon_sites_to_mask.txt'
            return {int(line) for line in open(path) if line.strip()}

        orf1b_mask, orf1ab_mask = read_mask('ORF1b'), read_mask(fitness_gene)
        if not orf1b_mask:
            sys.exit('ORF1b_codon_sites_to_mask.txt is empty. ORF1b resolves its '
                     'coordinates from pcp_gene_cds_blocks and never appears in '
                     'counts_all.csv gene column, so a name-based match silently '
                     'masks nothing and its DASM-ready PCPs keep every '
                     'problematic site (#133)')
        if max(orf1b_mask) > n_codons or min(orf1b_mask) < 1:
            sys.exit(f'ORF1b codon sites must fall in 1..{n_codons}; got '
                     f'{min(orf1b_mask)}..{max(orf1b_mask)} -- the mask is in the '
                     f'wrong codon numbering')
        # Two derivations of one thing: ORF1b's mask comes from nt_site via its
        # CDS blocks, ORF1ab's from the count table's own codon_site column, so
        # equality here means the two coordinate systems agree.
        first, last = offset + 1, offset + n_codons
        shifted = {c - offset for c in orf1ab_mask if first <= c <= last}
        if orf1b_mask != shifted:
            sys.exit(f'ORF1b mask disagrees with {fitness_gene} shifted by '
                     f'{offset}: only in ORF1b {sorted(orf1b_mask - shifted)}, '
                     f'only in shifted {sorted(shifted - orf1b_mask)}')
        print(f'ORF1b masks {len(orf1b_mask)} codon sites == '
              f'{fitness_gene}[{first}:{last}] - {offset}')
        "

    - name: Check validation results
      run: |
        pixi run python -c "
        import pandas as pd

        # Load discrepancies
        disc = pd.read_csv('${OUTPUT_DIR}/validation/S/pcp_vs_counts_discrepancies.csv')
        print(f'Validation discrepancies: {len(disc)}')

        # Check if validation passed
        if len(disc) == 0:
            print('SUCCESS: PCP and aamut_fitness counts match exactly!')
        else:
            print(f'WARNING: {len(disc)} discrepancies found')
            # Analyze discrepancy types
            only_pcp = len(disc[disc['actual_count'] == 0])
            only_aamut = len(disc[disc['pcp_count'] == 0])
            mismatch = len(disc) - only_pcp - only_aamut
            print(f'  Only in PCPs: {only_pcp}')
            print(f'  Only in aamut_fitness: {only_aamut}')
            print(f'  Count mismatches: {mismatch}')
        "

    - name: Verify sliding-window outputs
      run: |
        test -f $OUTPUT_DIR/windows/subtree_counts.csv
        test -f $OUTPUT_DIR/windows/founder_muts.csv
        pixi run python -c "
        import pandas as pd
        counts = pd.read_csv('${OUTPUT_DIR}/windows/subtree_counts.csv')
        founders = pd.read_csv('${OUTPUT_DIR}/windows/founder_muts.csv')
        print(f'Window count rows: {len(counts)}; founder rows: {len(founders)}')
        expected = ['window_start','founder_id','protein','nt_site','nt_mutation',
                    'aa_mutation','codon_change','synonymous','count']
        assert list(counts.columns) == expected, f'unexpected columns: {list(counts.columns)}'
        assert len(counts) > 0 and len(founders) > 0, 'empty windowing outputs'
        print(f'Distinct windows: {counts[\"window_start\"].nunique()}')
        "

    - name: Verify windowed fitness trajectory (#118)
      run: |
        test -f $OUTPUT_DIR/windows/fitness_trajectory.csv
        pixi run python -c "
        import pandas as pd
        traj = pd.read_csv('${OUTPUT_DIR}/windows/fitness_trajectory.csv')
        print(f'Trajectory rows: {len(traj)}; windows: {traj[\"window_start\"].nunique()}')
        expected = ['window_start','ID','gene','aa_site','aa_mutation','wt_aa',
                    'mut_aa','synonymous','actual_count','expected_count',
                    'delta_fitness_ratio']
        assert list(traj.columns) == expected, f'unexpected columns: {list(traj.columns)}'
        assert len(traj) > 0, 'empty fitness trajectory'
        assert (traj['gene'] == 'ORF1a').sum() == 0, 'ORF1a should be folded into ORF1ab'
        syn = traj[traj['synonymous'] == True]
        # Per-window evol_time T makes sum(actual_syn)==sum(expected_syn) by construction.
        ratio = syn['actual_count'].sum() / syn['expected_count'].sum()
        print(f'Synonymous calibration sum(actual)/sum(expected): {ratio:.6f} (should be ~1)')
        assert abs(ratio - 1.0) < 1e-3, f'synonymous calibration off: {ratio}'
        print(f'Synonymous delta_fitness_ratio median: {syn[\"delta_fitness_ratio\"].median():.4f}')
        "

    - name: Validate windowing (pure + output CSV checks)
      run: |
        pixi run python workflow/scripts/validate_windowing.py $OUTPUT_DIR

    - name: Validate windowing (tree-level algorithmic checks)
      run: |
        export CONDARC="$HOME/.condarc"
        pixi run snakemake $OUTPUT_DIR/windows/validation_report.txt \
          -j $(nproc) --use-conda --conda-frontend conda \
          --configfile config/config_test_data.yaml
        cat $OUTPUT_DIR/windows/validation_report.txt

    - name: Generate test summary
      run: |
        pixi run python workflow/scripts/test_summary.py $OUTPUT_DIR > test_summary.txt

    - name: Compare with expected results
      run: |
        pixi run python workflow/scripts/validate_test.py

    - name: Upload test summary
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-summary
        path: test_summary.txt
