# =============================================================================
# Input/Output Configuration
# =============================================================================
# Trees to process (one Snakemake run builds all of them). Each tree's label
# becomes an output dir {output_root}/{label}_{version}; output_root defaults to
# "results", so this writes to results/test_data_$(cat VERSION) and
# results/test_data_early_$(cat VERSION). Do not spell the version out here -- a
# literal goes stale at the next bump (#88).
trees:
  # Default global max_leaf_date (2022-06-01) -> 25 clades / 2437 sequences.
  # Byte-identical outputs to config_test_data.yaml's single tree.
  test_data:
    mat: "data/test_data/filtered_tree_raw.pb.gz"
    metadata: "data/test_data/filtered_metadata.tsv.gz"
  # Per-tree max_leaf_date override (earlier cutoff) -> 20 clades / 560 sequences.
  # The different clade count proves the two get_clades checkpoints resolve
  # independently -- neither tree's output leaks into the other.
  test_data_early:
    mat: "data/test_data/filtered_tree_raw.pb.gz"
    metadata: "data/test_data/filtered_metadata.tsv.gz"
    max_leaf_date: "2021-06-01"

# =============================================================================
# Reference Genome Configuration
# =============================================================================
ref_fasta: "http://hgdownload.soe.ucsc.edu/goldenPath/wuhCor1/bigZips/wuhCor1.fa.gz"
ref_gtf: "http://hgdownload.soe.ucsc.edu/goldenPath/wuhCor1/bigZips/genes/ncbiGenes.gtf.gz"

# Manual GTF additions (genes missing from reference)
add_to_ref_gtf:
  ORF9b: [28284, 28577]

# =============================================================================
# Metadata QC Filtering
# =============================================================================
qc_filter_options:
  invalid_date_resolutions: ["MISSING", "MONTH", "YEAR"]
  min_leaf_date: "2019-12-01"
  max_leaf_date: "2022-06-01"  # global default; a tree may override under its label
  valid_hosts: ["Human", "Homo sapiens"]
  missing_host_is_valid: true
  min_genome_length: 28000
  max_genome_length: 32000

subset_frac: 0.1  # Random sampling fraction (1.0 = no sampling)

# =============================================================================
# Tree Processing
# =============================================================================
optimize_tree: false
mat_subset_kwargs: ""  # Additional matUtils extract arguments

# =============================================================================
# Clade Configuration
# =============================================================================
clade_column: "Nextstrain_clade"
min_clade_size: 2
# Exclude clades with no resolvable founder, matching config.yaml's exclusion of
# 21A. Neither is reachable at max_clades: 3 today -- the first three adequate
# clades are 19A/19B/20A -- but both would now be a hard failure if max_clades
# were raised, since clade_founder_fasta.py no longer falls back to the reference
# (#129):
#   21A          absent from the Neher JSON (the only 19A-22F clade that is) and
#                not a Pango key, so it resolves in none of the three sources.
#   recombinant  a catch-all metadata label rather than a clade; it has 4 samples
#                in the test data and passes min_clade_size. The production
#                configs use Nextstrain_clade_usher, which has no such value.
clades_to_exclude:
  - 21A
  - recombinant
max_clades: 3  # Set to limit number of clades processed (useful for testing)

# Reference clade for motif/codon annotation (using 19A to match production behavior)
reference_clade: "19A"

# =============================================================================
# PCP Extraction Configuration
# =============================================================================
# Set to null for full genome, or specify region.
#
# Proteins to generate PCPs and gene-sliced founder FASTAs for. Coordinates
# are derived from the reference GTF's CDS blocks, so the stop codon is
# excluded and ORF1ab's ribosomal frameshift is reconstructed into a single
# in-frame CDS. Output paths use the gene symbol verbatim (pcps/<gene>/,
# clade_founders/<gene>/).
pcp_genes:
  - S
  - ORF1ab
  - E

# PCP branch QC reuses the shared Mutation-Counting keys (max_nt_mutations /
# max_reversions_to_ref / max_reversions_to_clade_founder), applied to CODING
# mutations only; noncoding mutations are excluded from quality criteria but
# still tracked.

# =============================================================================
# Clade Founder Configuration
# =============================================================================
clade_founders:
  neher_json: "https://raw.githubusercontent.com/neherlab/SC2_variant_rates/7e738194a8c6592082f1caa9a6ca70cb68289790/data/clade_gts.json"
  roemer_json: "https://raw.githubusercontent.com/corneliusroemer/pango-sequences/main/data/pango-consensus-sequences_summary.json"

# Mapping from Nextstrain clades to Pango lineages (for Roemer founders).
#
# Every config carries its own copy of this map, so a new clade must be added to
# each config whose tree contains it (grep roemer_nextstrain_to_pango config/).
# A clade missing from both this map and the Neher JSON is now a hard failure in
# clade_founder_fasta.py rather than a silent fallback to the Wuhan reference
# (#129) -- so a missing entry fails the run instead of corrupting it.
#
# Short on purpose: the test data cuts off well before the 24H-25C clades that
# the production configs need, and every clade it does contain resolves via the
# Neher JSON. The guard above is what makes that safe to rely on rather than a
# standing invitation to fall behind.
roemer_nextstrain_to_pango:
  23A: XBB.1.5
  23B: XBB.1.16

# =============================================================================
# Mutation Counting Configuration
# =============================================================================
max_nt_mutations: 4
max_reversions_to_ref: 1
max_reversions_to_clade_founder: 1

site_include_range:
  start: 266   # Start of ORF1ab
  end: 29674   # End of ORF10

# Sites to exclude globally (problematic hotspots)
sites_to_exclude:
  # Sites in Table S1 of https://journals.plos.org/plosgenetics/article?id=10.1371/journal.pgen.1009175
  - 153
  - 1149
  - 2198
  - 3145
  - 3564
  - 3778
  - 4050
  - 6255
  - 8022
  - 8790
  - 13402
  - 13947
  - 22802
  - 24389
  - 24390
  - 24933
  # sites specified for exclusion because they have extremely high mutation
  # frequency in some clade
  - 5629   # T5629G is much higher (~5% of all) in clade 20A than any other mutation.
  - 6851   # C6851A and its reversion are top two mutations in 20C at ~5% and ~3% of all mutations
  - 7328   # ~6% of all mutations in clade 21I, also highly mutated (~4% of all) in several other clades
  - 28095  # ~11% of all mutations in clade 20I
  - 29362  # ~30% of all mutations in clade 21C
  # De Maio et al. homoplastic sites (https://virological.org/t/issues-with-sars-cov-2-sequencing-data/473):
  # high apparent homoplasy from sequencing artifacts, contamination, or recurrent
  # mutation. (Sites 4050, 8022, 13402 from this set already appear in Table S1 above.)
  - 187    # 5' UTR - frequent sequencing artifact
  - 1059   # nsp2
  - 2094   # nsp2
  - 3037   # nsp3 - synonymous C>T, common technical artifact
  - 3130   # nsp3
  - 6990   # nsp3
  - 10323  # nsp5 (3CLpro)
  - 10741  # nsp5
  - 11074  # nsp6
  - 11083  # nsp6
  - 13408  # nsp12
  - 14786  # nsp12
  - 15324  # nsp12
  - 19684  # nsp15
  - 20148  # nsp15
  - 21137  # nsp16
  - 21575  # Spike
  - 24034  # Spike
  - 24378  # Spike
  - 25563  # ORF3a
  - 26144  # ORF3a
  - 26461  # E
  - 26681  # M
  - 28077  # ORF8
  - 28826  # N
  - 28854  # N
  - 29700  # 3' UTR

# External masking sources
site_mask_vcf: "https://raw.githubusercontent.com/W-L/ProblematicSites_SARS-CoV2/master/subset_vcf/problematic_sites_sarsCov2.mask.vcf"
usher_masked_sites: "data/usher_masked_sites.yaml"

# =============================================================================
# GLM Rate Estimation
# =============================================================================
rna_structure_data: "data/lan_2022/41467_2022_28603_MOESM11_ESM.txt"

# Light-switch boundaries for position-dependent mutation rates
glm_lightswitch_boundaries:
  CT: 13467   # End of ORF1ab
  AT: 21562   # End of S gene
  CG: 21562
  GC: 21562

# =============================================================================
# Fitness Estimation Configuration
# =============================================================================
fitness_pseudocount: 0.5
fitness_N_f: 10        # Number of points for fitness grid
fitness_N_n_exp: 10    # Number of points for expected counts grid

# ORF1ab to NSP mapping (amino acid site ranges)
orf1ab_to_nsps:
  nsp1: [1, 180]
  nsp2: [181, 818]
  nsp3: [819, 2763]
  nsp4: [2764, 3263]
  nsp5: [3264, 3569]
  nsp6: [3570, 3859]
  nsp7: [3860, 3942]
  nsp8: [3943, 4140]
  nsp9: [4141, 4253]
  nsp10: [4254, 4392]
  nsp12: [4393, 5324]
  nsp13: [5325, 5925]
  nsp14: [5926, 6452]
  nsp15: [6453, 6798]
  nsp16: [6799, 7096]

# Gene overlap handling
gene_overlaps:
  retain:
    - ["ORF1ab", "ORF1a"]
    - ["N", "ORF9b"]
  exclude:
    - ["S", "ORF3a"]

# Gene ordering for output
genes:
  - "ORF1ab"
  - "nsp1"
  - "nsp2"
  - "nsp3"
  - "nsp4"
  - "nsp5"
  - "nsp6"
  - "nsp7"
  - "nsp8"
  - "nsp9"
  - "nsp10"
  - "nsp12"
  - "nsp13"
  - "nsp14"
  - "nsp15"
  - "nsp16"
  - "S"
  - "ORF3a"
  - "E"
  - "M"
  - "ORF6"
  - "ORF7a"
  - "ORF7b"
  - "ORF8"
  - "N"
  - "ORF10"

# =============================================================================
# Site Masking Configuration
# =============================================================================

# =============================================================================
# Thread Configuration
# =============================================================================
threads:
  filter_metadata: 1
  filter_mat_tree: 1
  optimize_mat_tree: 12
  mat_clade_subset: 1
  extract_pcps: 1
  count_mutations: 1
  master_table: 1
  ntmut_fitness: 1
  default: 1
