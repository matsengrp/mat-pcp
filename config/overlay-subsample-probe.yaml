# Overlay: one clade-subsampling probe arm (#151).
#
# Layered on top of a production config rather than edited into it:
#
#   pixi run snakemake --configfile config/config-2026-08-06-six-genes.yaml \
#                                   config/overlay-subsample-probe.yaml ...
#
# Snakemake merges multiple --configfile values in order, so this adds the arm
# without touching the config that built the released tree. That matters for two
# reasons: every shipped production config is required to leave
# `clade_subsamples` empty (arms are launched by naming their paths, because
# full-size arms cost tens of wall-hours), and a modified production config would
# otherwise have to be reverted by hand afterwards.
#
# 21J and 21I are one unit because clade labels are finer than backgrounds: 21I's
# spike founder differs from 21J's by a single amino acid while carrying 424,135
# samples, 9.8% of 21J's 4,344,573 on the gisaid tree. Thinning 21J alone would
# leave that ~10% at full depth as an evidence floor and mask the bottom of the
# ladder. 21A is Delta too but sits in `clades_to_exclude` (no founder is
# defined), so it produces no subtree and cannot set a floor -- which is what
# makes {21J, 21I} sufficient.
#
# All four fractions, run concurrently. A probe-then-extend approach would be
# the wrong economics here, and the benchmarks say why: on the 20% arm's own
# 186 jobs, `ntmut_fitness` is **88% of the 8.51 CPU-h** an arm costs (56
# clades at a flat 8.0 min), and it is **independent of the sampling
# fraction**, because it works over the mutation grid, which
# `build_count_table` enumerates from the clade founders and fills with zeros.
# So a 1% arm costs essentially the same as a 20% arm: everything that shrinks
# with the fraction is subtree-derived, and that is ~7 CPU-min of the total
# (`mat_clade_subset` 4.0, the three sample-path rules and
# `count_mutations_clade` 2.8). The arms are also mutually independent --
# different `arm_dir`, no shared outputs -- so one snakemake invocation fills
# its job slots across all four.
#
# Two per-arm jobs are *not* fraction-scaled and set the floor on any arm:
# `build_count_table` at 11.1 min and `expected_counts_by_clade` at 3.0.
#
# The draw is a pure function of (unit, seed, clade, fraction), so adding
# fractions here cannot move an arm that has already been built.
clade_subsamples:
  - unit: [21J, 21I]
    sampling_fractions: [0.01, 0.05, 0.10, 0.20]
    seed: 0
