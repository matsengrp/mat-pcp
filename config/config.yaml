# =============================================================================
# Input/Output Configuration
# =============================================================================
output_dir: "results"
mat: "path/to/tree.pb.gz"
metadata: "path/to/metadata.tsv.gz"

# =============================================================================
# Reference Genome Configuration
# =============================================================================
ref_fasta: "http://hgdownload.soe.ucsc.edu/goldenPath/wuhCor1/bigZips/wuhCor1.fa.gz"
ref_gtf: "http://hgdownload.soe.ucsc.edu/goldenPath/wuhCor1/bigZips/genes/ncbiGenes.gtf.gz"

# Manual GTF additions (genes missing from reference)
add_to_ref_gtf:
  ORF9b: [28284, 28577]

# =============================================================================
# Metadata QC Filtering
# =============================================================================
qc_filter_options:
  invalid_date_resolutions: ["MISSING", "MONTH", "YEAR"]
  min_date: "2019-12-01"
  datetime_cutoff: "2022-06-01"
  valid_hosts: ["Human", "Homo sapiens"]
  missing_host_is_valid: true
  min_genome_length: 28000
  max_genome_length: 32000

subset_frac: 1.0  # Random sampling fraction (1.0 = no sampling)
skip_qc_filtering: false  # Set to true to skip all QC filtering (for SARS2-mut-fitness comparison)

# =============================================================================
# Tree Processing
# =============================================================================
optimize_tree: false
mat_subset_kwargs: ""  # Additional matUtils extract arguments

# =============================================================================
# Clade Configuration
# =============================================================================
clade_column: "Nextstrain_clade"
min_clade_size: 2
clades_to_exclude: []
# max_clades: null  # Set to limit number of clades processed (useful for testing)

# Reference clade for motif/codon annotation
# Used to determine "conserved" sites during GLM training data curation
# This should be the ancestral/reference clade (typically 19A for SARS-CoV-2)
# matching SARS2-mut-fitness-v2 behavior
# NOTE: THE PIPELINE WILL CRASH IF THIS CLADE IS NOT PRESENT DUE TO ADEQUATE SAMPLES
# SEE `min_clade_size` SETTING ABOVE
reference_clade: "19A"

# =============================================================================
# PCP Extraction Configuration
# =============================================================================
# Set to null for full genome, or specify region.
#
# Coordinates are 1-based INCLUSIVE on both ends, relative to the Wuhan-Hu-1
# reference (NC_045512.2). For Spike, ``end: 25381`` deliberately excludes the
# trailing stop codon by convention: 21563-25381 yields 3819 nt = 1273 codons.
# The Python slice used downstream is ``seq[start-1:end]`` (see
# ``workflow/scripts/pcp_from_tree.py``), which produces the same inclusive
# nucleotide range.
pcp_gene_region:
  gene: S       # Gene name for validation filtering
  start: 21563  # Spike start (1-based, inclusive)
  end: 25381    # Spike end (1-based, inclusive; excludes stop codon)

# PCP filtering parameters (applied to CODING mutations only)
# Noncoding mutations are excluded from quality criteria but still tracked
pcp_max_nt_mutations: 4
pcp_max_reversions_to_ref: 1
pcp_max_reversions_to_clade_founder: 1

# =============================================================================
# Clade Founder Configuration
# =============================================================================
clade_founders:
  neher_json: "https://raw.githubusercontent.com/neherlab/SC2_variant_rates/7e738194a8c6592082f1caa9a6ca70cb68289790/data/clade_gts.json"
  roemer_json: "https://raw.githubusercontent.com/corneliusroemer/pango-sequences/main/data/pango-consensus-sequences_summary.json"

# Mapping from Nextstrain clades to Pango lineages (for Roemer founders)
roemer_nextstrain_to_pango:
  23A: XBB.1.5
  23B: XBB.1.16
  # Add more mappings as needed

# =============================================================================
# Mutation Counting Configuration
# =============================================================================
# Maximum number of CODING mutations per branch (aligns with SARS2-mut-fitness)
# Branches with more coding mutations are filtered out as likely erroneous
max_nt_mutations: 4
# Maximum reversions to reference/founder in CODING regions only
# Noncoding reversions excluded from quality criteria (error-prone)
max_reversions_to_ref: 1
max_reversions_to_clade_founder: 1

site_include_range:
  start: 266   # Start of ORF1ab
  end: 29674   # End of ORF10

# Sites to exclude globally (problematic hotspots)
sites_to_exclude:
  # Sites in Table S1 of https://journals.plos.org/plosgenetics/article?id=10.1371/journal.pgen.1009175
  - 153
  - 1149
  - 2198
  - 3145
  - 3564
  - 3778
  - 4050
  - 6255
  - 8022
  - 8790
  - 13402
  - 13947
  - 22802
  - 24389
  - 24390
  - 24933
  # sites specified for exclusion because they have extremely high mutation
  # frequency in some clade
  - 5629   # T5629G is much higher (~5% of all) in clade 20A than any other mutation.
  - 6851   # C6851A and its reversion are top two mutations in 20C at ~5% and ~3% of all mutations
  - 7328   # ~6% of all mutations in clade 21I, also highly mutated (~4% of all) in several other clades
  - 28095  # ~11% of all mutations in clade 20I
  - 29362  # ~30% of all mutations in clade 21C
  # De Maio et al. homoplastic sites (https://virological.org/t/issues-with-sars-cov-2-sequencing-data/473):
  # high apparent homoplasy from sequencing artifacts, contamination, or recurrent
  # mutation. (Sites 4050, 8022, 13402 from this set already appear in Table S1 above.)
  - 187    # 5' UTR - frequent sequencing artifact
  - 1059   # nsp2
  - 2094   # nsp2
  - 3037   # nsp3 - synonymous C>T, common technical artifact
  - 3130   # nsp3
  - 6990   # nsp3
  - 10323  # nsp5 (3CLpro)
  - 10741  # nsp5
  - 11074  # nsp6
  - 11083  # nsp6
  - 13408  # nsp12
  - 14786  # nsp12
  - 15324  # nsp12
  - 19684  # nsp15
  - 20148  # nsp15
  - 21137  # nsp16
  - 21575  # Spike
  - 24034  # Spike
  - 24378  # Spike
  - 25563  # ORF3a
  - 26144  # ORF3a
  - 26461  # E
  - 26681  # M
  - 28077  # ORF8
  - 28826  # N
  - 28854  # N
  - 29700  # 3' UTR

# External masking sources
site_mask_vcf: "https://raw.githubusercontent.com/W-L/ProblematicSites_SARS-CoV2/master/subset_vcf/problematic_sites_sarsCov2.mask.vcf"
usher_masked_sites: "data/usher_masked_sites.yaml"

# =============================================================================
# GLM Rate Estimation
# =============================================================================
rna_structure_data: "data/lan_2022/41467_2022_28603_MOESM11_ESM.txt"

# Light-switch boundaries for position-dependent mutation rates
glm_lightswitch_boundaries:
  CT: 13467   # End of ORF1ab
  AT: 21562   # End of S gene
  CG: 21562
  GC: 21562

# =============================================================================
# Fitness Estimation Configuration
# =============================================================================
fitness_pseudocount: 0.5
fitness_N_f: 300        # Number of points for fitness grid
fitness_N_n_exp: 300    # Number of points for expected counts grid

# ORF1ab to NSP mapping (amino acid site ranges)
orf1ab_to_nsps:
  nsp1: [1, 180]
  nsp2: [181, 818]
  nsp3: [819, 2763]
  nsp4: [2764, 3263]
  nsp5: [3264, 3569]
  nsp6: [3570, 3859]
  nsp7: [3860, 3942]
  nsp8: [3943, 4140]
  nsp9: [4141, 4253]
  nsp10: [4254, 4392]
  nsp12: [4393, 5324]
  nsp13: [5325, 5925]
  nsp14: [5926, 6452]
  nsp15: [6453, 6798]
  nsp16: [6799, 7096]

# Gene overlap handling
gene_overlaps:
  retain:
    - ["ORF1ab", "ORF1a"]
    - ["N", "ORF9b"]
  exclude:
    - ["S", "ORF3a"]

# Gene ordering for output
genes:
  - "ORF1ab"
  - "nsp1"
  - "nsp2"
  - "nsp3"
  - "nsp4"
  - "nsp5"
  - "nsp6"
  - "nsp7"
  - "nsp8"
  - "nsp9"
  - "nsp10"
  - "nsp12"
  - "nsp13"
  - "nsp14"
  - "nsp15"
  - "nsp16"
  - "S"
  - "ORF3a"
  - "E"
  - "M"
  - "ORF6"
  - "ORF7a"
  - "ORF7b"
  - "ORF8"
  - "N"
  - "ORF10"

# =============================================================================
# Site Masking Configuration
# =============================================================================
masking_gene: "S"  # Gene for codon mask output

# =============================================================================
# Thread Configuration
# =============================================================================
threads:
  filter_metadata: 1
  filter_mat_tree: 1
  optimize_mat_tree: 12
  mat_clade_subset: 4
  extract_pcps: 1
  count_mutations: 1
  master_table: 4
  ntmut_fitness: 4
  default: 1
