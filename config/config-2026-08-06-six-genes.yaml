# =============================================================================
# 2026-08-06 MATs (public and GISAID-and-public), PCPs for six genes
# =============================================================================
# Copied from config-2026-04-22-gisaid-and-public-six-genes.yaml. Only the
# `trees` block, `clades_to_exclude` and `roemer_nextstrain_to_pango` differ;
# every other setting is shared with that file and with config.yaml. The
# GISAID-and-public tree uses restricted GISAID-derived inputs.
#
# The six genes are S, ORF1a, ORF1b, M, N and E -- every non-accessory protein:
# the four structural proteins plus the two replicase polyproteins. ORF1b, M, N
# and E were added for v9 (#133, EPIC #131 decision 6).
#
# WHY THIS IS A SEPARATE FILE RATHER THAN TWO MORE TREES IN THE 04-22 CONFIG.
# The 2026-08-06 trees carry six clades the 2026-04-22 tree does not (25D-25I),
# five of which need new `roemer_nextstrain_to_pango` entries. That map is passed
# whole as a rule param to `clade_founder_fasta` (one job per clade per tree), so
# adding an entry invalidates *every* clade founder of *every* tree in the same
# config -- including the 51 already built for `gisaid-and-public_2026-04-22_v10`,
# which is the released, tagged v10 tree. A dry run of the merged config planned
# 1,242 jobs overwriting it: all 306 PCP extractions, all 51 founders, the GLM and
# every fitness output. Adding the *trees* is free (nothing keys on the tree list);
# adding the *clades* is not. Keeping the released tree in a config that no longer
# matches its tag is the hazard, so it stays in its own file, untouched.
#
# `clades_to_exclude` is safe by contrast -- it is read inside the `get_clades_list`
# input function, not as a rule param -- but it is only needed here, so it lives here.

# =============================================================================
# Input/Output Configuration
# =============================================================================
# Output dirs are derived as results/{label}_v{VERSION}. Both trees carry the same
# 58 Nextstrain_clade_usher values.
trees:
  gisaid-and-public_2026-08-06:
    mat: "../mat-trees/2026-08-06-gisaid-and-public/gisaidAndPublic.2026-08-06.masked.pb.gz"
    metadata: "../mat-trees/2026-08-06-gisaid-and-public/gisaidAndPublic.2026-08-06.metadata.tsv.gz"
    max_leaf_date: "2026-08-06"
  public_2026-08-06:
    mat: "../mat-trees/2026-08-06-public/public-2026-08-06.all.masked.pb.gz"
    metadata: "../mat-trees/2026-08-06-public/public-2026-08-06.metadata.tsv.gz"
    max_leaf_date: "2026-08-06"

# =============================================================================
# Reference Genome Configuration
# =============================================================================
ref_fasta: "http://hgdownload.soe.ucsc.edu/goldenPath/wuhCor1/bigZips/wuhCor1.fa.gz"
ref_gtf: "http://hgdownload.soe.ucsc.edu/goldenPath/wuhCor1/bigZips/genes/ncbiGenes.gtf.gz"

# Manual GTF additions (genes missing from reference)
# https://github.com/jbloomlab/SARS2-mut-fitness/issues/21
add_to_ref_gtf:
  ORF9b: [28284, 28577]

# =============================================================================
# Metadata QC Filtering
# =============================================================================
qc_filter_options:
  invalid_date_resolutions: ["MISSING", "MONTH", "YEAR"]
  min_leaf_date: "2019-12-01"
  # max_leaf_date: set per-tree in the `trees` block above.
  valid_hosts: ["Human", "Homo sapiens"]
  missing_host_is_valid: true
  min_genome_length: 28000
  max_genome_length: 32000

subset_frac: 1.0  # No random sampling - use all samples

# =============================================================================
# Tree Processing
# =============================================================================
optimize_tree: false
mat_subset_kwargs: ""

# =============================================================================
# Node Dating (chronumental)
# =============================================================================
# Passed verbatim to chronumental (e.g. "--steps 5000"). An unset value runs
# chronumental's own default step count; production step tuning is deferred
# (EPIC #115). NOTE: "--use_gpu" requires the CUDA jaxlib wheel that is
# commented out in envs/chronumental.yml; with the CPU-only env it silently
# falls back to CPU, so don't add it until GPU support is enabled there.
# --variance_dates 30 (#146): chronumental asserts each day-resolution leaf date to
# sd `variance_dates x 1 day`, and at the 0.3 default that term is three orders of
# magnitude tighter than the Poisson term on a 0-1 mutation branch -- so the fit buys
# leaf-date accuracy by inflating branch durations (#145). Measured on
# public_2026-08-06_v11, this moves root-to-tip/fitted from 4.31x to 1.48x, length_cor
# from 0.40 to 0.85, and the zero-mutation share of total branch-time from 45.9% to
# 1.4%, at the cost of the tip-residual margin: median |residual| 1 d -> 10 d against
# the 30 d gate below (p95 35 d, which the median-based gate does not read).
chronumental_kwargs: "--steps 1000 --variance_dates 30"
# chronumental_qc gate: fail the run if the median absolute tip-date residual
# (chronumental-predicted minus metadata collection date, in days) exceeds this.
chronumental_max_median_abs_tip_residual_days: 30

# =============================================================================
# Window Fitness (sliding time windows)
# =============================================================================
# Sliding time windows over the full dated tree (EPIC #115 Phase 2+). Windows
# are anchored at window_end_time and tile backwards, so the most recent window
# is always the full window_size. Branch QC reuses the Mutation-Counting keys
# (max_nt_mutations / max_reversions_to_ref / max_reversions_to_clade_founder),
# so the clade-based and window-based paths filter branches identically.
window_size: 90            # window width in days (~3 months)
window_step: 45            # window stride in days (half of window_size => 50% overlap)
window_start_time: null    # ISO date, or null to use the tree's earliest node date
window_end_time: null      # ISO date, or null to use the tree's latest node date
# Windowed expected counts + delta_fitness_ratio (Phase 3, #118). Drop founders
# whose subtree is <= this size before computing expected counts (0 keeps all).
window_min_subtree_size: 0

# =============================================================================
# Clade Configuration
# =============================================================================
# Use Nextstrain_clade from tree annotations (annotation_1 in matUtils summary)
clade_column: "Nextstrain_clade_usher"

# Minimum samples for a clade to be analyzed. Default 0 (analyze every clade);
# increase to ignore small clades.
min_clade_size: 0

# Excluded clades. Both are excluded for the same reason -- no clade founder can be
# resolved -- which since #129 is a hard failure rather than a silent fallback to the
# Wuhan reference, so an unresolvable clade must be named here or the run dies.
#
# 25I is new in the 2026-08-06 trees. Its lineage BA.3.2 is absent from both founder
# sources: the Neher JSON stops at 30 clades, and the Roemer JSON is frozen at
# designationDate 2025-06-19 with `nextstrainClade` labels ending at 25C, so it
# predates 25D-25I entirely. BA.3.2 specifically is skipped in that file's hierarchy --
# its children BA.3.2.1 and BA.3.2.2 are present and both point straight at parent
# BA.3. Mapping 25I to a child would ship a founder wrong at 6 of 115 substitutions;
# excluding it costs 87 samples of 17.3M (GISAID-and-public) and 21 of 8.5M (public),
# so exclusion is preferred over a knowingly-wrong founder.
clades_to_exclude:
  - 21A
  - 25I

# Reference clade for motif/codon annotation
# Used to determine "conserved" sites during GLM training data curation
# This should be the ancestral/reference clade (typically 19A for SARS-CoV-2)
# matching SARS2-mut-fitness-v2 behavior
reference_clade: "19A"

# =============================================================================
# PCP Extraction Configuration
# =============================================================================
# Proteins to generate PCPs and gene-sliced founder FASTAs for. Coordinates
# are derived from the reference GTF's CDS blocks, so the stop codon is
# excluded and ORF1ab's ribosomal frameshift is reconstructed into a single
# in-frame CDS. Output paths use the gene symbol verbatim (pcps/<gene>/,
# clade_founders/<gene>/).
pcp_genes:
  - S
  - ORF1a
  # ORF1b (nsp12-nsp16), M, N and E added for v9 (#133, EPIC #131 decision 6).
  # Only ORF1b needs explicit coordinates; M, N and E are single-block,
  # codon-aligned GTF features (666 nt / 222 codons, 1257 nt / 419 codons, and
  # 225 nt / 75 codons).
  #
  # With E this covers every non-accessory protein: the four structural proteins
  # (S, E, M, N) plus the replicase polyproteins (ORF1a, ORF1b). The accessory
  # ORFs (3a, 6, 7a, 7b, 8, 9b, 10) are deliberately out of scope. E is the
  # cheapest of the six by an order of magnitude -- 75 codons -- and needs no
  # pcp_gene_cds_blocks (the GTF carries it at 26245-26469), no
  # pcp_gene_to_fitness_gene (it reaches aamut_fitness under its own name), and
  # no gene_overlaps entry (ORF3a ends at 26217, M starts at 26523, so E abuts
  # neither).
  - ORF1b
  - M
  - N
  - E

# Explicit CDS blocks for PCP extraction only, for genes the shared reference
# GTF does not carry. 1-based inclusive; the two blocks share nt 13468, which is
# how the -1 ribosomal frameshift stays in frame.
#
# ORF1b here is nsp12-nsp16, NOT the post-slippage frameshift product. nsp12
# (RdRp) begins at ORF1ab codon 4393 but the frameshift is at codon 4402, so
# nsp12's first 9 residues are translated in ORF1a's frame. Defining ORF1b as
# the post-slippage block alone would silently clip 9 residues off the
# N-terminus of the protein this is chiefly for (#133).
pcp_gene_cds_blocks:
  ORF1b: [[13442, 13468], [13468, 21552]]   # nsp12-nsp16; 8112 nt = 2704 codons

# PCP gene -> the aamut_fitness gene it is validated against, plus the codon
# offset. ORF1a is absent from aamut_fitness (aamutfit.get_coding drops it), so
# through v8 its validation compared against zero rows and reported success
# having compared nothing; ORF1b is a PCP-only slice of ORF1ab. Both offsets are
# re-derived from the CDS blocks and cross-checked against these values (#133).
# S, M and N need no entry -- each appears in aamut_fitness as itself.
pcp_gene_to_fitness_gene:
  ORF1a: {gene: ORF1ab, codon_offset: 0}      # ORF1a codon N == ORF1ab codon N
  ORF1b: {gene: ORF1ab, codon_offset: 4392}   # ORF1b codon 1 == ORF1ab codon 4393

# PCP branch QC reuses the shared Mutation-Counting keys (max_nt_mutations /
# max_reversions_to_ref / max_reversions_to_clade_founder), so PCP extraction
# and clade/window mutation counting filter branches identically.

# Date-cutoff PCP subtrees (#149). For each cutoff, the whole per-gene PCP family is
# rebuilt under `pcps/{gene}/upto_{cutoff}/` from the subtree of samples collected at
# or before that date, so DASM can be trained on what was knowable then. Filenames
# inside the cutoff directory are identical to the full-tree ones.
#
# Optional, and per-tree overridable. Each value must be strict ISO YYYY-MM-DD, must
# postdate `qc_filter_options.min_leaf_date`, and must not exceed the tree's
# `max_leaf_date` -- a cutoff past the tree's own horizon would silently reproduce the
# full tree under a name claiming otherwise. A cutoff *equal* to `max_leaf_date` is
# allowed and is the degenerate case: it must reproduce the full outputs byte-for-byte.
pcp_date_cutoffs:
  - "2023-01-01"

# =============================================================================
# Clade Founder Configuration
# =============================================================================
clade_founders:
  neher_json: "https://raw.githubusercontent.com/neherlab/SC2_variant_rates/7e738194a8c6592082f1caa9a6ca70cb68289790/data/clade_gts.json"
  roemer_json: "https://raw.githubusercontent.com/corneliusroemer/pango-sequences/main/data/pango-consensus-sequences_summary.json"

# Mapping from Nextstrain clades to Pango lineages (for Roemer founders).
#
# Every config carries its own copy of this map, so a new clade must be added to
# each config whose tree contains it (grep roemer_nextstrain_to_pango config/).
# A clade missing from both this map and the Neher JSON is now a hard failure in
# clade_founder_fasta.py rather than a silent fallback to the Wuhan reference
# (#129) -- so a missing entry fails the run instead of corrupting it.
#
# Both trees here contain the same 58 Nextstrain_clade_usher values: the 52 the
# 2026-04-22 tree had (19A through 25C) plus 25D-25I. 30 resolve via the Neher JSON,
# 26 via the entries below, and 21A and 25I are in clades_to_exclude.
roemer_nextstrain_to_pango:
  23A: XBB.1.5
  23B: XBB.1.16
  23C: CH.1.1
  23D: XBB.1.9
  23E: XBB.2.3
  23F: EG.5.1
  23G: XBB.1.5.70
  23H: HK.3
  23I: BA.2.86
  24A: JN.1
  24B: JN.1.11.1
  24C: KP.3
  24D: XDV.1
  24E: KP.3.1.1
  24F: XEC
  24G: KP.2.3
  24H: LF.7
  24I: MV.1
  25A: LP.8.1
  25B: NB.1.8.1
  25C: XFG
  # New in the 2026-08-06 trees. These five resolve only because their Pango names
  # predate the Roemer JSON's 2025-06-19 freeze -- that file's own `nextstrainClade`
  # labels stop at 25C, so it cannot be consulted for the Nextstrain-clade side of
  # this mapping and the entries below were read off the tree metadata.
  25D: MC.10.2.1
  25E: PY.1
  25F: NW.1.2
  25G: XFC
  25H: XFJ

# =============================================================================
# Mutation Counting Configuration (match SARS2-mut-fitness)
# =============================================================================
max_nt_mutations: 4
max_reversions_to_ref: 1
max_reversions_to_clade_founder: 1

# Only include coding region sites
site_include_range:
  start: 266   # Start of ORF1ab
  end: 29674   # End of ORF10

# Sites to exclude globally (from SARS2-mut-fitness config)
# Table S1 of https://journals.plos.org/plosgenetics/article?id=10.1371/journal.pgen.1009175
# Plus additional high-frequency mutation sites
sites_to_exclude:
  # Sites in Table S1 of https://journals.plos.org/plosgenetics/article?id=10.1371/journal.pgen.1009175
  - 153
  - 1149
  - 2198
  - 3145
  - 3564
  - 3778
  - 4050
  - 6255
  - 8022
  - 8790
  - 13402
  - 13947
  - 22802
  - 24389
  - 24390
  - 24933
  # sites specified for exclusion because they have extremely high mutation
  # frequency in some clade
  - 5629   # T5629G is much higher (~5% of all) in clade 20A than any other mutation.
  - 6851   # C6851A and its reversion are top two mutations in 20C at ~5% and ~3% of all mutations
  - 7328   # ~6% of all mutations in clade 21I, also highly mutated (~4% of all) in several other clades
  - 28095  # ~11% of all mutations in clade 20I
  - 29362  # ~30% of all mutations in clade 21C
  # De Maio et al. homoplastic sites (https://virological.org/t/issues-with-sars-cov-2-sequencing-data/473):
  # high apparent homoplasy from sequencing artifacts, contamination, or recurrent
  # mutation. (Sites 4050, 8022, 13402 from this set already appear in Table S1 above.)
  - 187    # 5' UTR - frequent sequencing artifact
  - 1059   # nsp2
  - 2094   # nsp2
  - 3037   # nsp3 - synonymous C>T, common technical artifact
  - 3130   # nsp3
  - 6990   # nsp3
  - 10323  # nsp5 (3CLpro)
  - 10741  # nsp5
  - 11074  # nsp6
  - 11083  # nsp6
  - 13408  # nsp12
  - 14786  # nsp12
  - 15324  # nsp12
  - 19684  # nsp15
  - 20148  # nsp15
  - 21137  # nsp16
  - 21575  # Spike
  - 24034  # Spike
  - 24378  # Spike
  - 25563  # ORF3a
  - 26144  # ORF3a
  - 26461  # E
  - 26681  # M
  - 28077  # ORF8
  - 28826  # N
  - 28854  # N
  - 29700  # 3' UTR

# External masking sources
site_mask_vcf: "https://raw.githubusercontent.com/W-L/ProblematicSites_SARS-CoV2/master/subset_vcf/problematic_sites_sarsCov2.mask.vcf"
usher_masked_sites: "data/usher_masked_sites.yaml"


# =============================================================================
# GLM Rate Estimation
# =============================================================================
rna_structure_data: "data/lan_2022/41467_2022_28603_MOESM11_ESM.txt"

# Light-switch boundaries for position-dependent mutation rates
glm_lightswitch_boundaries:
  CT: 13467   # End of ORF1ab
  AT: 21562   # End of S gene
  CG: 21562
  GC: 21562

# =============================================================================
# Fitness Estimation Configuration (match SARS2-mut-fitness)
# =============================================================================
fitness_pseudocount: 0.5
fitness_N_f: 300
fitness_N_n_exp: 300

# ORF1ab to NSP mapping (amino acid site ranges). Note the display names
# "nsp5 (Mpro)" and "nsp12 (RdRp)" for those two NSPs.
orf1ab_to_nsps:
  nsp1: [1, 180]
  nsp2: [181, 818]
  nsp3: [819, 2763]
  nsp4: [2764, 3263]
  nsp5: null
  nsp5 (Mpro): [3264, 3569]
  nsp6: [3570, 3859]
  nsp7: [3860, 3942]
  nsp8: [3943, 4140]
  nsp9: [4141, 4253]
  nsp10: [4254, 4392]
  nsp12: null
  nsp12 (RdRp): [4393, 5324]
  nsp13: [5325, 5925]
  nsp14: [5926, 6452]
  nsp15: [6453, 6798]
  nsp16: [6799, 7096]

# Gene overlap handling (match SARS2-mut-fitness)
gene_overlaps:
  exclude:
    - [ORF1a, ORF1ab]   # 11 sites of overlap near ribosomal frameshifting
    - [ORF7a, ORF7b]    # 1 site of overlap corresponding to ORF7a stop codon
  retain:
    - [N, ORF9b]        # ORF9b is a 291 out-of-frame overlapping reading frame in N

# Gene ordering for output
genes:
  - "ORF1ab"
  - "nsp1"
  - "nsp2"
  - "nsp3"
  - "nsp4"
  - "nsp5 (Mpro)"
  - "nsp6"
  - "nsp7"
  - "nsp8"
  - "nsp9"
  - "nsp10"
  - "nsp12 (RdRp)"
  - "nsp13"
  - "nsp14"
  - "nsp15"
  - "nsp16"
  - "S"
  - "ORF3a"
  - "E"
  - "M"
  - "ORF6"
  - "ORF7a"
  - "ORF7b"
  - "ORF8"
  - "ORF9b"
  - "N"
  - "ORF10"

# =============================================================================
# Site Masking Configuration
# =============================================================================

# =============================================================================
# Thread Configuration
# =============================================================================
threads:
  filter_metadata: 1
  filter_mat_tree: 4
  optimize_mat_tree: 12
  chronumental: 4
  chronumental_qc: 1
  window_subtree_counts: 4
  window_expected_counts: 4
  mat_clade_subset: 4
  extract_pcps: 1
  count_mutations: 1
  master_table: 4
  ntmut_fitness: 4
  default: 1
