[workspace]
name = "mat-pcp"
version = "0.1.0"
description = "Mutation-annotated tree parent-child pair extraction pipeline"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[activation.env]
CONDARC = ".condarc"

[tasks]

[dependencies]
snakemake = ">=7.32.4,<8"
conda = ">=23.7.4,<24"
mamba = ">=1.5.1,<2"
python = ">=3.9,<3.12"
pandas = ">=1.5.3,<3"
setuptools = ">=65.0.0"
